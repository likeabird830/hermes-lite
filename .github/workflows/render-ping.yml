# Render Keep-Alive Pinger
# 每5分钟ping一次Render URL，防止免费层spin-down
name: Render Keep-Alive

on:
  schedule:
    # UTC 时间，每5分钟跑一次
    - cron: '*/5 * * * *'
  # 也允许手动触发（方便测试）
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render to prevent spin-down
        run: |
          echo "[$(date -u)] Pinging Render..."
          
          # Ping 主服务（HTTP GET，超时10秒）
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
            "https://hermes-lite.onrender.com/" 2>&1)
          
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "304" ]; then
            echo "✅ Render is alive!"
          else
            echo "⚠️ Unexpected status: $STATUS"
            # 尝试第二次
            sleep 5
            STATUS2=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://hermes-lite.onrender.com/" 2>&1)
            echo "Retry status: $STATUS2"
          fi
